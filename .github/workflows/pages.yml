
name: Deploy static site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install measurement dependencies
        working-directory: apps/comparative/measurement
        run: npm install

      - name: Build measurement app
        working-directory: apps/comparative/measurement
        run: npm run build

      - name: Build catalog
        run: python3 scripts/build-catalog.py

      - name: Prepare static site
        run: |
          mkdir -p _site

          rsync -av \
            --exclude='_site' \
            --exclude='.git' \
            --exclude='apps/comparative/measurement/node_modules' \
            ./ ./_site/

          rm -rf _site/apps/comparative/measurement
          mkdir -p _site/apps/comparative/measurement
          cp -r apps/comparative/measurement/dist/* _site/apps/comparative/measurement/

          python3 scripts/inject-feedback.py . _site
          python3 scripts/inject-analytics.py . _site

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
